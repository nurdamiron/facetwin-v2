<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Icon gallery</title>
<body style="margin:0;background:#0E0E14;color:#F5F3F7;font:600 11px Manrope,system-ui,sans-serif">
<div id="g" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;padding:12px"></div>
<script type="module">
import { ico, ICON_NAMES } from "../icons.js";
document.getElementById("g").innerHTML = ICON_NAMES.map((n) => `<div style="background:#1A1A24;border-radius:14px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:8px">${ico(n, 30)}<span>${n}</span></div>`).join("");
</script>
